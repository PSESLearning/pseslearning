        /* =====================================================
           LOAD QUESTION
        ===================================================== */

        function loadQuestion() {

            const q =
                quizData[current];


            /*
                Reset option styling
            */

            cards.forEach(card => {

                card.classList.remove(
                    "active",
                    "correct",
                    "wrong"
                );

                card.style.pointerEvents =
                    "auto";

            });


            /*
                Clear error
            */

            errorEl.innerText = "";

            errorEl.classList.remove("show");


            /*
                Show question
            */

            questionEl.innerText =
                q.question;


            /*
                Create options
            */

            cards.forEach((card, i) => {

                card.innerHTML = `

                    <input
                        type="radio"
                        name="option"
                        value="${i}"
                    >

                    <span>
                        ${q.options[i]}
                    </span>

                `;


                /*
                    Option click
                */

                card.onclick = () => {

                    /*
                        If already submitted,
                        don't allow changing
                    */

                    if (submitted[current]) {

                        return;

                    }


                    /*
                        Remove error
                    */

                    errorEl.innerText = "";

                    errorEl.classList.remove(
                        "show"
                    );


                    /*
                        Remove active
                    */

                    cards.forEach(c => {

                        c.classList.remove(
                            "active"
                        );

                    });


                    /*
                        Select option
                    */

                    const radio =
                        card.querySelector("input");

                    radio.checked = true;


                    /*
                        Active style
                    */

                    card.classList.add(
                        "active"
                    );


                    /*
                        Save answer
                    */

                    userAnswers[current] =
                        i;

                };

            });


            /*
                Restore previously selected answer
            */

            const savedAnswer =
                userAnswers[current];


            if (savedAnswer !== null) {

                const selectedCard =
                    cards[savedAnswer];

                const selectedRadio =
                    selectedCard.querySelector(
                        "input"
                    );


                selectedRadio.checked = true;

                selectedCard.classList.add(
                    "active"
                );

            }


            /*
                Restore submitted state
            */

            if (submitted[current]) {

                showResult();

            }


            /*
                Progress
            */

            progressBar.style.width =
                `${((current + 1) / quizData.length) * 100}%`;


            /*
                Previous button
            */

            if (current > 0) {

                prevBtn.style.display =
                    "inline-block";

            } else {

                prevBtn.style.display =
                    "none";

            }


            /*
                Submit / Next buttons
            */

            if (submitted[current]) {

                submitBtn.style.display =
                    "none";

                nextBtn.style.display =
                    "inline-block";

            } else {

                submitBtn.style.display =
                    "inline-block";

                submitBtn.disabled =
                    false;

                nextBtn.style.display =
                    "none";

            }


            /*
                Last question
            */

            if (
                current ===
                quizData.length - 1
            ) {

                nextBtn.innerText =
                    "Finish Quiz →";

            } else {

                nextBtn.innerText =
                    "Next Question →";

            }

        }


        /* =====================================================
           GET SELECTED ANSWER
        ===================================================== */

        function getAnswer() {

            const selected =
                document.querySelector(
                    "input[name='option']:checked"
                );


            return selected
                ? parseInt(selected.value)
                : null;

        }


        /* =====================================================
           SHOW CORRECT / WRONG
        ===================================================== */

        function showResult() {

            const answer =
                userAnswers[current];

            const correct =
                quizData[current].correct;


            /*
                Disable options
            */

            cards.forEach((card, i) => {

                card.style.pointerEvents =
                    "none";


                /*
                    Correct option
                */

                if (i === correct) {

                    card.classList.add(
                        "correct"
                    );

                }


                /*
                    Wrong selected option
                */

                if (
                    i === answer &&
                    answer !== correct
                ) {

                    card.classList.add(
                        "wrong"
                    );

                }

            });

        }


        /* =====================================================
           SUBMIT ANSWER
        ===================================================== */

        submitBtn.onclick = () => {

            const answer =
                getAnswer();


            /*
                No answer
            */

            if (answer === null) {

                errorEl.innerText =
                    "⚠ Please select an option before submitting.";

                errorEl.classList.add(
                    "show"
                );

                return;

            }


            /*
                Save answer
            */

            userAnswers[current] =
                answer;


            /*
                Mark submitted
            */

            submitted[current] =
                true;


            /*
                Remove error
            */

            errorEl.innerText = "";

            errorEl.classList.remove(
                "show"
            );


            /*
                Show result
            */

            showResult();


            /*
                Hide Submit
            */

            submitBtn.style.display =
                "none";


            /*
                Show Next
            */

            nextBtn.style.display =
                "inline-block";


            /*
                Last question
            */

            if (
                current ===
                quizData.length - 1
            ) {

                nextBtn.innerText =
                    "Finish Quiz →";

            } else {

                nextBtn.innerText =
                    "Next Question →";

            }

        };


        /* =====================================================
           NEXT QUESTION
        ===================================================== */

        nextBtn.onclick = () => {

            /*
                Last question
            */

            if (
                current ===
                quizData.length - 1
            ) {

                showFinalResult();

                return;

            }


            /*
                Move forward
            */

            current++;

            loadQuestion();

        };


        /* =====================================================
           PREVIOUS QUESTION
        ===================================================== */

        prevBtn.onclick = () => {

            if (current <= 0) {

                return;

            }


            current--;

            loadQuestion();

        };


        /* =====================================================
           CALCULATE SCORE
        ===================================================== */

        function calculateScore() {

            let totalScore = 0;


            userAnswers.forEach(
                (answer, index) => {

                    if (
                        answer !== null &&
                        answer ===
                        quizData[index].correct
                    ) {

                        totalScore++;

                    }

                }
            );


            return totalScore;

        }


        /* =====================================================
           FINAL RESULT
        ===================================================== */

        function showFinalResult() {

            const finalScore =
                calculateScore();


            progressBar.style.width =
                "100%";


            document.querySelector(
                ".quiz-card"
            ).innerHTML = `

                <div class="result-box">

                    <h2>
                        🎉 Quiz Completed!
                    </h2>


                    <p class="score-text">
                        Your Score
                    </p>


                    <div class="score-circle">

                        ${finalScore}
                        /
                        ${quizData.length}

                    </div>


                    <p class="score-message">

                        ${finalScore >= 75
                    ? "Outstanding Performance 🚀"
                    : finalScore >= 60
                        ? "Great Job 🌟"
                        : finalScore >= 50
                            ? "Good Effort 👍"
                            : "Keep Practicing 💪"
                }

                    </p>


                    <button
                        onclick="location.reload()"
                        id="play-again"
                    >
                        Play Again
                    </button>

                </div>

            `;

        }


        /* =====================================================
           START QUIZ
        ===================================================== */

        loadQuestion();

    </script>
